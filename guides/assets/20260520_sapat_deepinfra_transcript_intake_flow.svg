<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Sapat DeepInfra transcript intake flow</title>
  <desc id="desc">A workflow diagram showing raw recordings, Sapat, DeepInfra, draft transcripts, review notes, and final transcripts.</desc>
  <rect width="960" height="360" fill="#f7f9fb"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#102030">
    <rect x="40" y="105" width="140" height="95" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="3"/>
    <text x="110" y="142" text-anchor="middle" font-weight="700">Raw video</text>
    <text x="110" y="172" text-anchor="middle">.mp4 files</text>
    <rect x="230" y="105" width="140" height="95" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="3"/>
    <text x="300" y="142" text-anchor="middle" font-weight="700">Sapat CLI</text>
    <text x="300" y="172" text-anchor="middle">ffmpeg to MP3</text>
    <rect x="420" y="105" width="140" height="95" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="3"/>
    <text x="490" y="142" text-anchor="middle" font-weight="700">DeepInfra</text>
    <text x="490" y="172" text-anchor="middle">Whisper API</text>
    <rect x="610" y="105" width="140" height="95" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="3"/>
    <text x="680" y="142" text-anchor="middle" font-weight="700">Draft</text>
    <text x="680" y="172" text-anchor="middle">.txt output</text>
    <rect x="800" y="105" width="120" height="95" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="3"/>
    <text x="860" y="142" text-anchor="middle" font-weight="700">Final</text>
    <text x="860" y="172" text-anchor="middle">handoff</text>
    <path d="M180 152h48" stroke="#102030" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M370 152h48" stroke="#102030" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M560 152h48" stroke="#102030" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M750 152h48" stroke="#102030" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="230" y="248" width="520" height="58" rx="10" fill="#e6f2ef" stroke="#9dc9bd"/>
    <text x="490" y="283" text-anchor="middle">Intake ledger tracks provider, model, prompt, reviewer, and status</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#102030"/>
    </marker>
  </defs>
</svg>
